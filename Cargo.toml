[package]
name = "lml"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "A terminal application"
license = "MIT"
repository = "https://github.com/mathiasringhof/lml"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30.2"

[lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
allow_attributes_without_reason = "deny"
# Application internals do not need library-style API documentation/annotations.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Split functions for cohesion, not to satisfy an arbitrary line count.
too_many_lines = "allow"
